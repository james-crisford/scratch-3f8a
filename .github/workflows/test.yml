name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Build and test (iOS Simulator)
    runs-on: macos-15
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          echo "=== Available Xcode versions ==="
          ls /Applications | grep -i xcode || true
          # Pick the highest installed Xcode 16.x — the iOS 18.0 SDK in 16.0 is not installed
          XCODE_APP=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE_APP" ]; then XCODE_APP="/Applications/Xcode.app"; fi
          echo "Selecting: $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version
          swift --version
          echo "=== Installed iOS Simulator runtimes ==="
          xcrun simctl list runtimes | head -20

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project from project.yml
        run: |
          xcodegen generate --spec project.yml
          ls -la PuttingLab.xcodeproj

      - name: Show simulators
        run: xcrun simctl list devices available | head -40

      - name: Build for iPhone 15 Simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project PuttingLab.xcodeproj \
            -scheme PuttingLab \
            -destination 'platform=iOS Simulator,OS=18.5,name=iPhone 16' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            | tee build.log

      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project PuttingLab.xcodeproj \
            -scheme PuttingLab \
            -destination 'platform=iOS Simulator,OS=18.5,name=iPhone 16' \
            -enableCodeCoverage YES \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | tee test.log

      - name: Summarise test results
        if: always()
        run: |
          echo "=== Test summary ==="
          grep -E "(Test Suite|Test Case|passed|failed|TEST FAILED|TEST SUCCEEDED|Executed)" test.log | tail -50 || echo "(no test.log)"

      - name: Upload test result bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: TestResults.xcresult
          retention-days: 14
          if-no-files-found: warn

      - name: Upload build/test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            build.log
            test.log
          retention-days: 14
          if-no-files-found: warn

      # Archive step — produces a generic .xcarchive for inspection.
      # This is NOT signed for distribution; that needs Apple Developer credentials
      # in GitHub secrets (DEVELOPMENT_TEAM, signing cert P12, provisioning profile).
      # For now it just proves an iOS Device archive build succeeds.
      - name: Archive (generic iOS, unsigned)
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild archive \
            -project PuttingLab.xcodeproj \
            -scheme PuttingLab \
            -archivePath build/PuttingLab.xcarchive \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | tee archive.log

      - name: Upload xcarchive
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: PuttingLab.xcarchive
          path: build/PuttingLab.xcarchive
          retention-days: 14
          if-no-files-found: warn
