name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release:
        description: 'Push signed IPA to TestFlight (needs secrets configured)'
        type: boolean
        required: false
        default: false

jobs:
  test:
    name: Build and test (iOS Simulator)
    runs-on: macos-15
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          echo "=== Available Xcode versions ==="
          ls /Applications | grep -i xcode || true
          # Pick the highest installed Xcode 16.x — the iOS 18.0 SDK in 16.0 is not installed
          XCODE_APP=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE_APP" ]; then XCODE_APP="/Applications/Xcode.app"; fi
          echo "Selecting: $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version
          swift --version
          echo "=== Installed iOS Simulator runtimes ==="
          xcrun simctl list runtimes | head -20

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project from project.yml
        run: |
          xcodegen generate --spec project.yml
          ls -la PuttingLab.xcodeproj

      - name: Show simulators
        run: xcrun simctl list devices available | head -40

      - name: Build for iPhone 15 Simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project PuttingLab.xcodeproj \
            -scheme PuttingLab \
            -destination 'platform=iOS Simulator,OS=18.5,name=iPhone 16' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            | tee build.log

      - name: Run unit tests
        timeout-minutes: 8
        run: |
          set -o pipefail
          # Test-execution-time-allowance prevents individual tests from hanging.
          # Outer timeout-minutes prevents xcodebuild post-test cleanup from hanging.
          xcodebuild test \
            -project PuttingLab.xcodeproj \
            -scheme PuttingLab \
            -destination 'platform=iOS Simulator,OS=18.5,name=iPhone 16' \
            -enableCodeCoverage YES \
            -resultBundlePath TestResults.xcresult \
            -test-timeouts-enabled YES \
            -maximum-test-execution-time-allowance 30 \
            CODE_SIGNING_ALLOWED=NO \
            | tee test.log

      - name: Shut down simulators (prevent hung process)
        if: always()
        run: |
          xcrun simctl shutdown all || true
          killall -9 com.apple.CoreSimulator.CoreSimulatorService || true

      - name: Summarise test results
        if: always()
        run: |
          echo "=== Test summary ==="
          grep -E "(Test Suite|Test Case|passed|failed|TEST FAILED|TEST SUCCEEDED|Executed)" test.log | tail -50 || echo "(no test.log)"

      - name: Upload test result bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: TestResults.xcresult
          retention-days: 14
          if-no-files-found: warn

      - name: Upload build/test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            build.log
            test.log
          retention-days: 14
          if-no-files-found: warn

      # Archive step — produces a generic .xcarchive for inspection.
      # This is NOT signed for distribution; that needs Apple Developer credentials
      # in GitHub secrets (DEVELOPMENT_TEAM, signing cert P12, provisioning profile).
      # For now it just proves an iOS Device archive build succeeds.
      - name: Archive (generic iOS, unsigned)
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild archive \
            -project PuttingLab.xcodeproj \
            -scheme PuttingLab \
            -archivePath build/PuttingLab.xcarchive \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | tee archive.log

      - name: Upload xcarchive
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: PuttingLab.xcarchive
          path: build/PuttingLab.xcarchive
          retention-days: 14
          if-no-files-found: warn

  # Signed TestFlight upload — runs ONLY when the workflow is manually triggered with
  # release=true AND all 4 secrets are configured. Otherwise it skips silently.
  #
  # Required GitHub secrets (set under Settings → Secrets and variables → Actions):
  #   - SIGNING_CERT_P12_BASE64    Base64 of the .p12 cert exported from developer portal
  #   - SIGNING_CERT_PASSWORD      Password used when exporting the .p12
  #   - PROVISIONING_PROFILE_B64   Base64 of the .mobileprovision file
  #   - APP_STORE_CONNECT_API_KEY  Base64 of the .p8 App Store Connect API key
  #   - APP_STORE_CONNECT_KEY_ID   The 10-char key ID from App Store Connect
  #   - APP_STORE_CONNECT_ISSUER_ID  The issuer UUID from App Store Connect
  #   - APPLE_TEAM_ID              Your 10-char Apple Developer Team ID
  #   - APP_BUNDLE_ID              e.g. com.jamescrisford.puttinglab
  release:
    name: Sign + Upload to TestFlight
    needs: test
    runs-on: macos-15
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.release == 'true'
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          XCODE_APP=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE_APP" ]; then XCODE_APP="/Applications/Xcode.app"; fi
          sudo xcode-select -s "$XCODE_APP"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Verify required secrets are present
        env:
          CERT_B64: ${{ secrets.SIGNING_CERT_P12_BASE64 }}
          CERT_PASS: ${{ secrets.SIGNING_CERT_PASSWORD }}
          PROFILE_B64: ${{ secrets.PROVISIONING_PROFILE_B64 }}
          APIKEY_B64: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BUNDLE_ID: ${{ secrets.APP_BUNDLE_ID }}
        run: |
          missing=""
          [ -z "$CERT_B64" ]    && missing="$missing SIGNING_CERT_P12_BASE64"
          [ -z "$CERT_PASS" ]   && missing="$missing SIGNING_CERT_PASSWORD"
          [ -z "$PROFILE_B64" ] && missing="$missing PROVISIONING_PROFILE_B64"
          [ -z "$APIKEY_B64" ]  && missing="$missing APP_STORE_CONNECT_API_KEY"
          [ -z "$KEY_ID" ]      && missing="$missing APP_STORE_CONNECT_KEY_ID"
          [ -z "$ISSUER_ID" ]   && missing="$missing APP_STORE_CONNECT_ISSUER_ID"
          [ -z "$TEAM_ID" ]     && missing="$missing APPLE_TEAM_ID"
          [ -z "$BUNDLE_ID" ]   && missing="$missing APP_BUNDLE_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets:$missing"
            echo "Configure under Settings → Secrets and variables → Actions"
            exit 1
          fi
          echo "All 8 secrets present."

      - name: Patch project.yml with team + bundle ID
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BUNDLE_ID: ${{ secrets.APP_BUNDLE_ID }}
        run: |
          # Remove CODE_SIGNING_ALLOWED: NO on app target and inject team + bundle id
          python3 - <<'PY'
          import os, re
          path = "project.yml"
          src = open(path).read()
          src = src.replace("CODE_SIGNING_ALLOWED: NO", "CODE_SIGNING_ALLOWED: YES")
          src = src.replace(
              "PRODUCT_BUNDLE_IDENTIFIER: com.puttinglab.app",
              f"PRODUCT_BUNDLE_IDENTIFIER: {os.environ['BUNDLE_ID']}"
          )
          src = src.replace(
              'DEVELOPMENT_TEAM: ""',
              f'DEVELOPMENT_TEAM: {os.environ["TEAM_ID"]}'
          )
          open(path, "w").write(src)
          PY
          xcodegen generate --spec project.yml

      - name: Install signing certificate
        env:
          CERT_B64: ${{ secrets.SIGNING_CERT_P12_BASE64 }}
          CERT_PASS: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/build.keychain"
          security create-keychain -p ciCI "$KC"
          security default-keychain -s "$KC"
          security unlock-keychain -p ciCI "$KC"
          echo "$CERT_B64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$CERT_PASS" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k ciCI "$KC"
          security find-identity -v -p codesigning "$KC"

      - name: Install provisioning profile
        env:
          PROFILE_B64: ${{ secrets.PROVISIONING_PROFILE_B64 }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE_B64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          UUID=$(security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" | plutil -extract UUID raw -)
          cp "$RUNNER_TEMP/profile.mobileprovision" ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision
          echo "PROFILE_UUID=$UUID" >> $GITHUB_ENV
          echo "Installed profile UUID: $UUID"

      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project PuttingLab.xcodeproj \
            -scheme PuttingLab \
            -archivePath build/PuttingLab.xcarchive \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -allowProvisioningUpdates \
            | tee archive.log

      - name: Export IPA
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BUNDLE_ID: ${{ secrets.APP_BUNDLE_ID }}
        run: |
          cat > exportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>uploadBitcode</key><false/>
            <key>uploadSymbols</key><true/>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$BUNDLE_ID</key><string>$PROFILE_UUID</string>
            </dict>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath build/PuttingLab.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist exportOptions.plist
          ls -la build/ipa

      - name: Upload IPA to TestFlight
        env:
          APIKEY_B64: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APIKEY_B64" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_$KEY_ID.p8
          IPA=$(ls build/ipa/*.ipa | head -1)
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA" \
            --apiKey "$KEY_ID" \
            --apiIssuer "$ISSUER_ID"

      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PuttingLab.ipa
          path: build/ipa/*.ipa
          retention-days: 14
