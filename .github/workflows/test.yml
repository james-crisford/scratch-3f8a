name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Build and test (iOS Simulator)
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          sudo xcode-select -s /Applications/Xcode_16.0.app
          xcodebuild -version
          swift --version

      - name: Generate Xcode project if missing
        run: |
          if [ ! -d "PuttingLab.xcodeproj" ]; then
            echo "::error::PuttingLab.xcodeproj not committed yet — first Mac setup pending."
            echo "Run MAC_SETUP.md steps 1-5 once on a Mac, commit the .xcodeproj, then push."
            exit 78
          fi

      - name: Show simulators
        run: xcrun simctl list devices available

      - name: Build for iPhone 15 Simulator
        run: |
          xcodebuild build \
            -project PuttingLab.xcodeproj \
            -scheme PuttingLab \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            | tee build.log
          test ${PIPESTATUS[0]} -eq 0

      - name: Run unit tests
        run: |
          xcodebuild test \
            -project PuttingLab.xcodeproj \
            -scheme PuttingLab \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            -enableCodeCoverage YES \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | tee test.log
          test ${PIPESTATUS[0]} -eq 0

      - name: Summarise test results
        if: always()
        run: |
          if [ -d TestResults.xcresult ]; then
            xcrun xcresulttool get --legacy --format json --path TestResults.xcresult \
              | python3 -c "
import json, sys
data = json.load(sys.stdin)
metrics = data.get('metrics', {})
print('Tests run:', metrics.get('testsCount', {}).get('_value', '?'))
print('Tests failed:', metrics.get('testsFailedCount', {}).get('_value', '0'))
print('Tests skipped:', metrics.get('testsSkippedCount', {}).get('_value', '0'))
"
          fi

      - name: Upload test result bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: TestResults.xcresult
          retention-days: 14
