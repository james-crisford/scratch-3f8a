name: Test

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'briefs/**'
      - 'research_archive/**'
      - '.gitignore'
      - 'LICENSE'
      - '.claude/**'
      # Cost control: these don't affect the iOS build/test surface.
      - 'data/**'           # raw stroke JSONs + DB README — pure data
      - 'tools/**'          # Python ingestion + parameter-search tooling
      - '.tmp/**'           # scratch (gitignored anyway, belt-and-braces)
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'briefs/**'
      - 'research_archive/**'
      - '.gitignore'
      - 'LICENSE'
      - '.claude/**'
      # Cost control: these don't affect the iOS build/test surface.
      - 'data/**'           # raw stroke JSONs + DB README — pure data
      - 'tools/**'          # Python ingestion + parameter-search tooling
      - '.tmp/**'           # scratch (gitignored anyway, belt-and-braces)
  workflow_dispatch:
    inputs:
      release:
        description: 'Push signed IPA to TestFlight (needs secrets configured)'
        type: boolean
        required: false
        default: false
      skip_tests:
        description: 'Skip the test job (use ONLY when you know tests already pass — saves ~$0.30 of macOS minutes per release attempt)'
        type: boolean
        required: false
        default: false

# Cancel any in-flight run on the same branch when a new push arrives.
# Stops back-to-back commits from each spending a full 5-minute Mac slot.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test (iOS Simulator)
    runs-on: macos-26
    timeout-minutes: 15
    # Cost-control: skip the test job when manually triggered with skip_tests=true.
    # Use ONLY when you know the tests already pass on this exact commit (e.g. you
    # just want a signed TestFlight build and tests passed on the prior push).
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.skip_tests != 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          echo "=== Available Xcode versions ==="
          ls /Applications | grep -i xcode || true
          # Apple now requires apps to be built with iOS 26 SDK / Xcode 26 (validation
          # error from App Store Connect since April 2026). macos-26 runner has
          # Xcode 26.0–26.3 with 26.2 as default. Pick highest available.
          XCODE_APP=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE_APP" ]; then XCODE_APP="/Applications/Xcode.app"; fi
          echo "Selecting: $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version
          swift --version
          echo "=== Installed iOS Simulator runtimes ==="
          xcrun simctl list runtimes | head -20

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project from project.yml
        run: |
          xcodegen generate --spec project.yml
          ls -la PuttingLab.xcodeproj

      # Cache the Xcode build outputs keyed on source-file + project-config hash.
      # First run: cold. Second+ run: ~45-60s off the build step.
      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: deriveddata-${{ runner.os }}-${{ hashFiles('project.yml', 'PuttingLab/**/*.swift', 'PuttingLabTests/**/*.swift') }}
          restore-keys: |
            deriveddata-${{ runner.os }}-

      - name: Show simulators
        run: xcrun simctl list devices available | head -40

      - name: Build for iPhone 15 Simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project PuttingLab.xcodeproj \
            -scheme PuttingLab \
            -destination 'platform=iOS Simulator,OS=latest,name=iPhone 17' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            | tee build.log

      - name: Run unit tests
        timeout-minutes: 8
        run: |
          set -o pipefail
          # Test-execution-time-allowance prevents individual tests from hanging.
          # Outer timeout-minutes prevents xcodebuild post-test cleanup from hanging.
          xcodebuild test \
            -project PuttingLab.xcodeproj \
            -scheme PuttingLab \
            -destination 'platform=iOS Simulator,OS=latest,name=iPhone 17' \
            -enableCodeCoverage YES \
            -resultBundlePath TestResults.xcresult \
            -test-timeouts-enabled YES \
            -maximum-test-execution-time-allowance 30 \
            CODE_SIGNING_ALLOWED=NO \
            | tee test.log

      - name: Shut down simulators (prevent hung process)
        if: always()
        run: |
          xcrun simctl shutdown all || true
          killall -9 com.apple.CoreSimulator.CoreSimulatorService || true

      - name: Summarise test results
        if: always()
        run: |
          echo "=== Test summary ==="
          grep -E "(Test Suite|Test Case|passed|failed|TEST FAILED|TEST SUCCEEDED|Executed)" test.log | tail -50 || echo "(no test.log)"

      - name: Fail if zero tests executed
        if: success()
        run: |
          # Guard: B23-era CI silently ran 0 tests because project.yml had
          # a duplicate `targets:` key in schemes.PuttingLab.test that
          # YAML-clobbered the proper TestableReference list. xcodebuild
          # exited 0 with "Executed 0 tests". Catch that here so we never
          # ship audit fixes again without them actually being verified.
          if grep -E "Executed 0 tests" test.log >/dev/null 2>&1; then
            echo "::error::xcodebuild ran Executed 0 tests — scheme TestAction is empty. Check project.yml schemes."
            exit 1
          fi
          EXECUTED=$(grep -oE "Executed [0-9]+ tests" test.log | tail -1 | awk '{print $2}')
          if [ -z "$EXECUTED" ] || [ "$EXECUTED" -lt 1 ]; then
            echo "::error::Could not determine test execution count from test.log"
            exit 1
          fi
          echo "✓ Executed $EXECUTED tests"

      - name: Upload test result bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: TestResults.xcresult
          retention-days: 14
          if-no-files-found: warn

      - name: Upload build/test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            build.log
            test.log
          retention-days: 14
          if-no-files-found: warn

      # Screenshot the app running on iPhone 17 simulator. MANUAL-ONLY.
      # Boots the sim, installs the build, launches, captures the launch view.
      # Useful for a quick visual sanity check before TestFlight is available.
      - name: Capture launch screenshot
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: |
          set -e
          SIM_ID=$(xcrun simctl list devices available | grep "iPhone 17 (" | head -1 | grep -E -o '[0-9A-F-]{36}')
          echo "Using simulator: $SIM_ID"
          xcrun simctl boot "$SIM_ID" 2>/dev/null || true
          xcrun simctl bootstatus "$SIM_ID" -b
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "PuttingLab.app" -path "*Debug-iphonesimulator*" | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "No simulator .app found in DerivedData — building one"
            xcodebuild build \
              -project PuttingLab.xcodeproj \
              -scheme PuttingLab \
              -destination "platform=iOS Simulator,id=$SIM_ID" \
              -configuration Debug \
              CODE_SIGNING_ALLOWED=NO
            APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "PuttingLab.app" -path "*Debug-iphonesimulator*" | head -1)
          fi
          echo "App path: $APP_PATH"
          xcrun simctl install "$SIM_ID" "$APP_PATH"
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP_PATH/Info.plist")
          echo "Bundle ID: $BUNDLE_ID"
          xcrun simctl launch "$SIM_ID" "$BUNDLE_ID" || true
          sleep 5
          mkdir -p screenshots
          xcrun simctl io "$SIM_ID" screenshot screenshots/launch.png
          xcrun simctl status_bar "$SIM_ID" override --time "9:41" --batteryState charged --batteryLevel 100 || true
          sleep 1
          xcrun simctl io "$SIM_ID" screenshot screenshots/launch-clean.png
          ls -la screenshots

      - name: Upload screenshots
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Screenshots
          path: screenshots/
          retention-days: 14
          if-no-files-found: warn

      # Archive step — produces a generic .xcarchive for inspection.
      # MANUAL-ONLY now (workflow_dispatch). Was running on every main push and
      # adding ~1-2 min per push for no daily benefit. Trigger it from the Actions
      # tab when you actually need to inspect an archive.
      - name: Archive (generic iOS, unsigned)
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild archive \
            -project PuttingLab.xcodeproj \
            -scheme PuttingLab \
            -archivePath build/PuttingLab.xcarchive \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | tee archive.log

      - name: Upload xcarchive
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: PuttingLab.xcarchive
          path: build/PuttingLab.xcarchive
          retention-days: 14
          if-no-files-found: warn

  # Signed TestFlight upload — runs ONLY when the workflow is manually triggered with
  # release=true AND all 4 secrets are configured. Otherwise it skips silently.
  #
  # Required GitHub secrets (set under Settings → Secrets and variables → Actions):
  #   - SIGNING_CERT_P12_BASE64    Base64 of the .p12 cert exported from developer portal
  #   - SIGNING_CERT_PASSWORD      Password used when exporting the .p12
  #   - PROVISIONING_PROFILE_B64   Base64 of the .mobileprovision file
  #   - APP_STORE_CONNECT_API_KEY  Base64 of the .p8 App Store Connect API key
  #   - APP_STORE_CONNECT_KEY_ID   The 10-char key ID from App Store Connect
  #   - APP_STORE_CONNECT_ISSUER_ID  The issuer UUID from App Store Connect
  #   - APPLE_TEAM_ID              Your 10-char Apple Developer Team ID
  #   - APP_BUNDLE_ID              e.g. com.jamescrisford.puttinglab
  release:
    name: Sign + Upload to TestFlight
    needs: test
    runs-on: macos-26
    # always() lets this job run even when `test` was SKIPPED via skip_tests=true.
    # Without it, a skipped dependency would skip this job too.
    if: |
      always() &&
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.release == 'true' &&
      (needs.test.result == 'success' || needs.test.result == 'skipped')
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          XCODE_APP=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE_APP" ]; then XCODE_APP="/Applications/Xcode.app"; fi
          sudo xcode-select -s "$XCODE_APP"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Verify required secrets are present
        env:
          CERT_B64: ${{ secrets.SIGNING_CERT_P12_BASE64 }}
          CERT_PASS: ${{ secrets.SIGNING_CERT_PASSWORD }}
          PROFILE_B64: ${{ secrets.PROVISIONING_PROFILE_B64 }}
          APIKEY_B64: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BUNDLE_ID: ${{ secrets.APP_BUNDLE_ID }}
        run: |
          missing=""
          [ -z "$CERT_B64" ]    && missing="$missing SIGNING_CERT_P12_BASE64"
          [ -z "$CERT_PASS" ]   && missing="$missing SIGNING_CERT_PASSWORD"
          [ -z "$PROFILE_B64" ] && missing="$missing PROVISIONING_PROFILE_B64"
          [ -z "$APIKEY_B64" ]  && missing="$missing APP_STORE_CONNECT_API_KEY"
          [ -z "$KEY_ID" ]      && missing="$missing APP_STORE_CONNECT_KEY_ID"
          [ -z "$ISSUER_ID" ]   && missing="$missing APP_STORE_CONNECT_ISSUER_ID"
          [ -z "$TEAM_ID" ]     && missing="$missing APPLE_TEAM_ID"
          [ -z "$BUNDLE_ID" ]   && missing="$missing APP_BUNDLE_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets:$missing"
            echo "Configure under Settings → Secrets and variables → Actions"
            exit 1
          fi
          echo "All 8 secrets present."

      - name: Generate Xcode project from project.yml
        run: |
          xcodegen generate --spec project.yml
          ls -la PuttingLab.xcodeproj

      - name: Install signing certificate
        env:
          CERT_B64: ${{ secrets.SIGNING_CERT_P12_BASE64 }}
          CERT_PASS: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KC="$RUNNER_TEMP/build.keychain"
          KC_PASS="ciCI"
          security create-keychain -p "$KC_PASS" "$KC"
          security default-keychain -s "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"

          # S2: prevent keychain auto-locking mid-archive (5-min default → 1h)
          security set-keychain-settings -lut 3600 "$KC"

          # Defensive decode: tr strips any \r/\n/whitespace from the secret in case
          # the value was pasted via Windows clipboard (PowerShell adds CR; web UI
          # may add trailing newline). printf+tr+base64 -d is bullet-proof.
          printf '%s' "$CERT_B64" | tr -d '\r\n ' | base64 -d > "$RUNNER_TEMP/cert.p12"
          ls -la "$RUNNER_TEMP/cert.p12"

          # S3: explicit pkcs12 format flag — autodetect occasionally fails on modern p12 exports
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$CERT_PASS" \
            -f pkcs12 -t cert \
            -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productbuild

          # S6: add codesign: to partition list (required on Xcode 16+ / macOS 15+)
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PASS" "$KC"

          # S1: add temp keychain to USER search list, otherwise xcodebuild won't find it
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | sed -e 's/"//g')

          # S5: verify exactly one Apple Distribution identity was imported
          security find-identity -v -p codesigning "$KC"
          COUNT=$(security find-identity -v -p codesigning "$KC" | grep -c "Apple Distribution" || true)
          if [ "$COUNT" -ne 1 ]; then
            echo "::error::Expected exactly 1 Apple Distribution identity in keychain, found $COUNT"
            exit 1
          fi
          echo "Confirmed: 1 Apple Distribution identity in keychain."

      - name: Install provisioning profile
        env:
          PROFILE_B64: ${{ secrets.PROVISIONING_PROFILE_B64 }}
        run: |
          set -euo pipefail
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          # Defensive decode (same belt-and-braces as cert step)
          printf '%s' "$PROFILE_B64" | tr -d '\r\n ' | base64 -d > "$RUNNER_TEMP/profile.mobileprovision"
          ls -la "$RUNNER_TEMP/profile.mobileprovision"
          # S8: tr -d '\r\n ' on the extracted UUID to defend against stray bytes
          UUID=$(security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" | plutil -extract UUID raw - | tr -d '\r\n ')
          if [ -z "$UUID" ]; then
            echo "::error::Failed to extract UUID from provisioning profile"
            exit 1
          fi
          cp "$RUNNER_TEMP/profile.mobileprovision" ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision
          echo "PROFILE_UUID=$UUID" >> $GITHUB_ENV
          echo "Installed profile UUID: $UUID"

      - name: Archive
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BUNDLE_ID: ${{ secrets.APP_BUNDLE_ID }}
        run: |
          set -o pipefail
          # Signing settings are passed via command-line build settings rather
          # than patching project.yml — cleaner + more robust. Project keeps
          # CODE_SIGN_STYLE: Automatic + DEVELOPMENT_TEAM: "" as defaults; the
          # overrides below take effect only for this archive invocation.
          xcodebuild archive \
            -project PuttingLab.xcodeproj \
            -scheme PuttingLab \
            -archivePath build/PuttingLab.xcarchive \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGNING_ALLOWED=YES \
            | tee archive.log

      - name: Export IPA
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BUNDLE_ID: ${{ secrets.APP_BUNDLE_ID }}
        run: |
          cat > exportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>uploadBitcode</key><false/>
            <key>uploadSymbols</key><true/>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$BUNDLE_ID</key><string>$PROFILE_UUID</string>
            </dict>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath build/PuttingLab.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist exportOptions.plist
          ls -la build/ipa

      - name: Upload IPA to TestFlight
        env:
          APIKEY_B64: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          mkdir -p ~/.appstoreconnect/private_keys
          # Defensive decode (same belt-and-braces as cert + profile steps)
          KEY_PATH=~/.appstoreconnect/private_keys/AuthKey_$KEY_ID.p8
          printf '%s' "$APIKEY_B64" | tr -d '\r\n ' | base64 -d > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          IPA=$(ls build/ipa/*.ipa | head -1)
          if [ -z "$IPA" ] || [ ! -f "$IPA" ]; then
            echo "::error::No IPA found in build/ipa/"
            ls -la build/ipa/ || true
            exit 1
          fi
          echo "Uploading $IPA to TestFlight..."
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA" \
            --apiKey "$KEY_ID" \
            --apiIssuer "$ISSUER_ID"

      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PuttingLab.ipa
          path: build/ipa/*.ipa
          retention-days: 14
