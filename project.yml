name: PuttingLab
options:
  bundleIdPrefix: com.puttinglab
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
  generateEmptyDirectories: false
  defaultConfig: Debug

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    GCC_TREAT_WARNINGS_AS_ERRORS: NO
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  PuttingLab:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: PuttingLab
        excludes:
          - "Info.plist"
    info:
      path: PuttingLab/Info.plist
      properties:
        CFBundleDisplayName: PuttingLab
        CFBundleShortVersionString: "0.1.2"
        CFBundleVersion: "6"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities:
          - arm64
          - gyroscope
          - accelerometer
          - magnetometer
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: "PuttingLab uses the camera for AR tracking to anchor your putting line. We never record or upload images."
        NSMotionUsageDescription: "PuttingLab reads motion data from your iPhone's sensors to detect your swing."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.puttinglab.app
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: PuttingLab/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGNING_ALLOWED: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  PuttingLabTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: PuttingLabTests
    dependencies:
      - target: PuttingLab
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.puttinglab.app.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/PuttingLab.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/PuttingLab"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  PuttingLab:
    build:
      targets:
        PuttingLab: all
        PuttingLabTests: [test]
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - PuttingLabTests
    run:
      config: Debug
    archive:
      config: Release
