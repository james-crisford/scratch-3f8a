<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  body { margin: 0; background: #d6cdb7; }
  canvas { display: block; width: 1200px; height: 800px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const HOLE_DIA = 0.10795;
const HOLE_DEPTH = 0.08;
const RIM_OUTER = HOLE_DIA * 1.20;
const POLE_DIA = 0.015;
const POLE_HEIGHT = 0.70;
const FLAG_W = 0.15;
const FLAG_H = 0.10;

function floorTex() {
  const c = document.createElement('canvas'); c.width=c.height=512;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#d6cdb7'; ctx.fillRect(0,0,512,512);
  ctx.strokeStyle = 'rgba(140,120,90,0.35)'; ctx.lineWidth = 1;
  for (let y=0; y<512; y+=28) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(512,y); ctx.stroke(); }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(4,4);
  return t;
}
function wallTex() {
  // Subtle vertical cup-liner mould-line detail — real plastic
  // golf cups have ~6 mm seam lines from the moulding process.
  // We add very faint vertical bands so the wall looks like
  // actual plastic instead of a flat white surface, without
  // overpowering the natural light gradient.
  const c = document.createElement('canvas'); c.width=256; c.height=256;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#f4f4f4';
  ctx.fillRect(0,0,256,256);
  // 8 evenly-spaced subtle vertical mould lines
  ctx.strokeStyle = 'rgba(160,160,160,0.18)';
  ctx.lineWidth = 2;
  for (let x = 16; x < 256; x += 32) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 256); ctx.stroke();
  }
  // Tiny noise for plastic realism
  for (let i = 0; i < 600; i++) {
    ctx.fillStyle = `rgba(0,0,0,${Math.random()*0.04})`;
    ctx.fillRect(Math.random()*256, Math.random()*256, 1, 1);
  }
  return new THREE.CanvasTexture(c);
}

const canvas = document.getElementById('c');
canvas.width = 2400; canvas.height = 1600;
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setSize(1200, 800, false);
renderer.setPixelRatio(2);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xb0a890);
// LIGHTING for 10/10 cup-interior realism per Gemini's last note.
// The key idea: the SAME hard directional light that creates the
// flagstick's sharp floor shadow must penetrate the cup and
// create equally hard inside-wall shadows. This means:
//   (1) hemisphere/ambient light is REDUCED — was washing out
//       the interior contrast by filling shadow zones with soft
//       sky light
//   (2) directional KEY light is STRONGER — pumps brightness
//       into the lit-side wall and produces deeper shadow on
//       the opposite wall
//   (3) shadow map camera tightly focused on the cup region so
//       the rim's projected shadow lands sharply on the inside
//       wall instead of being diffused across a large footprint
scene.add(new THREE.HemisphereLight(0xffffff, 0xbfb38f, 0.25));
const key = new THREE.DirectionalLight(0xffffff, 3.2);
key.position.set(-1.5, 4.0, 1.5); key.castShadow = true;
key.shadow.mapSize.width = 4096; key.shadow.mapSize.height = 4096;
key.shadow.camera.near = 0.001; key.shadow.camera.far = 8;
key.shadow.camera.left = -0.25; key.shadow.camera.right = 0.25;
key.shadow.camera.top = 0.25; key.shadow.camera.bottom = -0.25;
key.shadow.bias = -0.00005;
scene.add(key);

// Floor with a circular HOLE cut at the cup centre so the camera
// can see DOWN into the cup interior. Without this, the floor
// plane occludes the cup opening and the dark interior is invisible
// — which is why Gemini scored 3/10. ShapeGeometry handles the
// hole cleanly. UV mapping for the texture survives the cut.
const floorShape = new THREE.Shape();
floorShape.moveTo(-5, -5);
floorShape.lineTo(5, -5);
floorShape.lineTo(5, 5);
floorShape.lineTo(-5, 5);
floorShape.lineTo(-5, -5);
const holePath = new THREE.Path();
holePath.absarc(0, 0, HOLE_DIA/2 * 0.99, 0, Math.PI * 2, true);
floorShape.holes.push(holePath);
const floorGeo = new THREE.ShapeGeometry(floorShape).rotateX(-Math.PI/2);
// Manually fix UV mapping for the floor texture
const uvs = floorGeo.attributes.uv;
for (let i = 0; i < uvs.count; i++) {
  const x = floorGeo.attributes.position.getX(i);
  const z = floorGeo.attributes.position.getZ(i);
  uvs.setXY(i, (x + 5) / 10, (z + 5) / 10);
}
const floor = new THREE.Mesh(
  floorGeo,
  new THREE.MeshStandardMaterial({ map: floorTex(), roughness: 0.85 })
);
floor.receiveShadow = true;
scene.add(floor);

// Gold rim — two-piece for a realistic physical bevel:
//   (a) MAIN GOLD RING — bright polished gold metal, the
//       reflective top face
//   (b) INNER BEVEL — slightly darker antique-gold edge facing
//       INTO the cup, where the metal piece angles down
// This sells the rim as a real machined gold collar instead of
// a printed gold disc.
const rim = new THREE.Mesh(
  new THREE.RingGeometry(HOLE_DIA/2 * 1.02, RIM_OUTER/2, 96).rotateX(-Math.PI/2),
  new THREE.MeshStandardMaterial({ color: 0xd4a847, roughness: 0.25, metalness: 0.95, side: THREE.DoubleSide })
);
rim.position.y = 0.0012;
rim.receiveShadow = true;
rim.castShadow = true;
scene.add(rim);

// Inner bevel — darker antique gold ring at the rim's inner
// edge. Reads as the chamfered metal edge meeting the cup.
const bevel = new THREE.Mesh(
  new THREE.RingGeometry(HOLE_DIA/2, HOLE_DIA/2 * 1.04, 96).rotateX(-Math.PI/2),
  new THREE.MeshStandardMaterial({
    color: 0x8a6020,         // darker brass / antique gold
    roughness: 0.45,
    metalness: 0.9,
    side: THREE.DoubleSide
  })
);
bevel.position.y = 0.0010;
bevel.receiveShadow = true;
scene.add(bevel);

// CONTACT SHADOW — soft thin dark ring on the floor immediately
// OUTSIDE the rim. Sells "this gold collar is embedded INTO the
// floor" instead of "this gold ring is sitting ON the floor".
// Gemini's prior 9/10 review called this out as the #1
// remaining gap (after the floor texture, which doesn't apply
// in real AR).
const contactShadow = new THREE.Mesh(
  new THREE.RingGeometry(RIM_OUTER/2, RIM_OUTER/2 * 1.18, 96).rotateX(-Math.PI/2),
  new THREE.MeshBasicMaterial({
    color: 0x000000,
    transparent: true,
    opacity: 0.18,
    side: THREE.DoubleSide,
    depthWrite: false
  })
);
contactShadow.position.y = 0.0008;
scene.add(contactShadow);

// Cup wall — WHITE PhysicallyBasedMaterial. James's feedback:
// real golf cups have white plastic liners, not dark interiors.
// The depth perception comes from the directional light
// naturally creating a bright/dark gradient: bright at the top
// rim where the light can enter, progressively darker going
// down because the rim itself blocks the light from reaching
// the bottom. Plus shadow cast from the flagstick onto the
// inside wall creates extra visual depth. With high shadow map
// resolution + a tight shadow camera around the cup, the
// darkening reads naturally.
const wall = new THREE.Mesh(
  new THREE.CylinderGeometry(HOLE_DIA/2 * 0.99, HOLE_DIA/2 * 0.99, HOLE_DEPTH, 96, 1, true),
  new THREE.MeshStandardMaterial({
    map: wallTex(),         // subtle mould-line texture
    color: 0xf4f4f4,        // tinted white plastic
    side: THREE.DoubleSide,
    roughness: 0.85,
    metalness: 0.0
  })
);
wall.position.y = -HOLE_DEPTH/2;
wall.receiveShadow = true;
scene.add(wall);

// Bottom — dark warm shadow (deep in the cup where no light
// reaches). Reads as the "shadow at the bottom of a real cup"
// rather than a void.
const bottom = new THREE.Mesh(
  new THREE.CircleGeometry(HOLE_DIA/2 * 0.98, 64).rotateX(-Math.PI/2),
  new THREE.MeshStandardMaterial({ color: 0x1a1410, roughness: 1.0 })
);
bottom.position.y = -HOLE_DEPTH + 0.0008;
bottom.receiveShadow = true;
scene.add(bottom);

// Hard AO ring at the rim/wall transition — strong dark line where
// the gold rim's inner edge meets the wall. Gemini's #2 failure cue
// was "no visible lip/edge"; this directly addresses it.
const ao = new THREE.Mesh(
  new THREE.RingGeometry(HOLE_DIA/2 * 0.93, HOLE_DIA/2 * 1.01, 96).rotateX(-Math.PI/2),
  new THREE.MeshBasicMaterial({ color: 0, transparent: true, opacity: 0.85, side: THREE.DoubleSide })
);
ao.position.y = 0.0014;
scene.add(ao);

// Matte black flagstick — Gemini's final note: pure 0x121212
// reads as "an unlit pole / 2D element" because real matte black
// still catches a subtle highlight from a strong directional
// light. Bumped colour slightly off pure black (0x1e1a1a) +
// lower metalness + medium roughness so the side facing the
// key light gets a faint sheen, giving the pole 3D form.
const pole = new THREE.Mesh(
  new THREE.CylinderGeometry(POLE_DIA/2, POLE_DIA/2, POLE_HEIGHT, 32),
  new THREE.MeshStandardMaterial({
    color: 0x1e1a1a,
    roughness: 0.55,
    metalness: 0.25
  })
);
pole.position.y = POLE_HEIGHT/2;
pole.castShadow = true;
scene.add(pole);

// Gold ferrule
const ferrule = new THREE.Mesh(
  new THREE.CylinderGeometry(POLE_DIA*0.85, POLE_DIA*0.85, 0.022, 16),
  new THREE.MeshStandardMaterial({ color: 0xd4a847, roughness: 0.3, metalness: 0.95 })
);
ferrule.position.y = 0.017; ferrule.castShadow = true;
scene.add(ferrule);

// Red flag
const flagGeo = new THREE.BufferGeometry();
const v = new Float32Array([
  POLE_DIA/2, 0, 0,
  POLE_DIA/2, FLAG_H, 0,
  POLE_DIA/2 + FLAG_W, FLAG_H/2, 0
]);
flagGeo.setAttribute('position', new THREE.BufferAttribute(v, 3));
flagGeo.setIndex([0,2,1,0,1,2]); flagGeo.computeVertexNormals();
const flag = new THREE.Mesh(
  flagGeo,
  new THREE.MeshStandardMaterial({ color: 0xd61a1a, side: THREE.DoubleSide, roughness: 0.7 })
);
flag.position.y = POLE_HEIGHT - FLAG_H - 0.02;
// Disable flag shadow casting — the flag's triangle silhouette
// was previously merging with the pole's shadow into one weird
// arrowhead shape. A clean rectangular pole shadow reads more
// physically correct, and the flag isn't tall enough to need a
// separate shadow at this scale.
flag.castShadow = false;
scene.add(flag);

// EXACTLY the 35° putting-stance angle
const cam = new THREE.PerspectiveCamera(45, 1.5, 0.001, 50);
cam.position.set(0, 0.30, 0.30);
cam.lookAt(0, 0.12, 0);
renderer.render(scene, cam);
</script>
</body>
</html>
